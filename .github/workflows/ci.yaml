name: ci
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - ".zed/**"
      - "README.md"
      - ".gitignore"
      - "LICENSE"

jobs:
  main:
    name: "Main"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: pnpm/setup@v1
        with:
          version: 11.11.0
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm check
      # Informational only: `pnpm audit` can flag advisories in dev/transitive
      # deps with no fixed release yet, so a hard failure here would block
      # merges for issues outside our control. `--prod` limits the scan to
      # runtime dependencies; `|| true` keeps the finding visible in logs
      # without failing the job.
      - run: pnpm audit --prod --audit-level=high || true

  coverage:
    name: "Coverage"
    runs-on: ubuntu-latest
    needs: [main]
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: pnpm/setup@v1
        with:
          version: 11.11.0
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:coverage
