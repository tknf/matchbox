name: ci
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["*"]
    paths-ignore:
      - "docs/**"
      - ".vscode/**"
      - "README.md"
      - ".gitignore"
      - "LICENSE"

jobs:
  main:
    name: "Main"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run lint:check
      - run: pnpm run format:check
      # Informational only: `pnpm audit` can flag advisories in dev/transitive
      # deps with no fixed release yet, so a hard failure here would block
      # merges for issues outside our control. `--prod` limits the scan to
      # runtime dependencies; `|| true` keeps the finding visible in logs
      # without failing the job.
      - run: pnpm audit --prod --audit-level=high || true

  coverage:
    name: "Coverage"
    runs-on: ubuntu-latest
    needs: [main]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install
      - run: pnpm run test:coverage
