version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/examples/basic"
      - "/examples/htaccess-auth"
      - "/examples/file-upload"
      - "/examples/session"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-major"
    groups:
      patches:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
      vite-major:
        applies-to: "version-updates"
        patterns:
          - "vite"
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-major"
    groups:
      patches:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
